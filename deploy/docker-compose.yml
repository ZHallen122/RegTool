# A local regtool-hub with the monitoring it exists to feed.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
#   hub         http://localhost:8080/v1/sources
#   prometheus  http://localhost:9090
#   grafana     http://localhost:3000  (no login: anonymous viewer)
#
# Tear it down with `docker compose -f deploy/docker-compose.yml down -v`; the
# -v is what also removes the check history and the Grafana state.

name: regtool-hub

services:
  hub:
    build:
      # The build context is the repository root, because the Dockerfile
      # compiles the whole module.
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - hub-data:/data
    environment:
      # Short enough that the dashboard has something to draw within a minute
      # of `up`. A real deployment wants the 5m default.
      REGTOOL_HUB_CHECK_INTERVAL: 60s
      REGTOOL_HUB_LOG_LEVEL: info
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - hub
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Anonymous viewing, for a stack that is only ever reachable from the
      # machine it runs on. Do not copy this into anything with a public port.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  hub-data:
  prometheus-data:
  grafana-data:
