{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "regtool-hub.serviceAccountName" . }}
  labels:
    {{- include "regtool-hub.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The hub never calls the API server, so the token is not projected into the
# pod; the account exists only so the workload is not "default".
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
