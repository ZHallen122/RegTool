# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: regtool

builds:
  - id: regtool
    binary: regtool
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ZHallen122/RegTool/internal/cli.Version={{ .Version }}
      - -X github.com/ZHallen122/RegTool/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/ZHallen122/RegTool/internal/cli.Date={{ .Date }}

  # The optional hub service. It is a separate build and a separate archive so
  # the regtool archive keeps exactly the contents the Homebrew formula and the
  # Scoop manifest already expect.
  - id: hub
    binary: regtool-hub
    main: ./cmd/regtool-hub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: regtool
    ids: [regtool]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "regtool_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

  - id: hub
    ids: [hub]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "regtool-hub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

dockers_v2:
  - id: hub
    # Only the hub binary goes into the image. Without this the CLI binary
    # would be copied into the build context too, for no reason.
    ids: [hub]
    images:
      - "ghcr.io/zhallen122/regtool-hub"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      "org.opencontainers.image.title": "regtool-hub"
      "org.opencontainers.image.description": "Serves the regtool mirror list and checks the mirrors in it"
      "org.opencontainers.image.url": "https://github.com/ZHallen122/RegTool"
      "org.opencontainers.image.source": "https://github.com/ZHallen122/RegTool"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "MIT"

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archive
    artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^test(\(.+\))?:'

homebrew_casks:
  - name: regtool
    # Only the CLI archive. Without this the cask would try to package the
    # hub archives too, and installing regtool would start shipping a
    # server nobody asked for.
    ids: [regtool]
    binaries:
      - regtool
    repository:
      owner: ZHallen122
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ZHallen122/RegTool"
    description: "Switch package manager registries between regional mirrors"
    license: "MIT"
    commit_author:
      name: ZHallen122
      email: zhallen12261@gmail.com
    # The binaries are not signed or notarized, so without this macOS refuses
    # to run them with the "regtool is damaged" Gatekeeper error.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/regtool"]
          end

scoops:
  - name: regtool
    ids: [regtool]
    repository:
      owner: ZHallen122
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      branch: main
    directory: bucket
    homepage: "https://github.com/ZHallen122/RegTool"
    description: "Switch package manager registries between regional mirrors"
    license: MIT
    commit_author:
      name: ZHallen122
      email: zhallen12261@gmail.com

release:
  draft: false
  prerelease: auto
