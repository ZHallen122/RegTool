name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # The regtool-hub image is published to this repository's ghcr namespace.
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: anchore/sbom-action/download-syft@v0

      # dockers_v2 runs a single `docker buildx build` for all platforms, so
      # the runner needs emulation for linux/arm64 and a buildx builder that
      # can produce a multi-platform manifest.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  # The chart is published only once the images and archives it points at
  # exist, so it never names a tag nobody can pull.
  helm:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      # The chart and the app move together on a release: both take the tag
      # with its leading v stripped, which is what Helm's SemVer wants.
      - name: Package the chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/regtool-hub \
            --version "$version" \
            --app-version "$version" \
            --destination dist
          ls -l dist

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push the chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm push "dist/regtool-hub-${version}.tgz" oci://ghcr.io/zhallen122/charts
